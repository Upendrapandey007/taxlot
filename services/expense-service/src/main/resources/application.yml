server:
  port: 8088

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taxlot_expense
    username: postgres
    password: password
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
  jackson:
    serialization:
      write-dates-as-timestamps: false

taxlot:
  events:
    exchange: taxlot.events
