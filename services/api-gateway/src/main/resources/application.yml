spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

taxlot:
  gateway:
    jwt-secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    organization-service-url: ${ORG_SERVICE_URL:http://localhost:8083}
    accounting-service-url: ${ACCOUNTING_SERVICE_URL:http://localhost:8084}
