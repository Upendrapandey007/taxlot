server:
  port: 8085
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taxlot_customer
    username: postgres
    password: password
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
