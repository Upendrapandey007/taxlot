spring:
  application:
    name: integration-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taxlot_integration}
    username: ${DB_USERNAME:taxlot}
    password: ${DB_PASSWORD:taxlot}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: 8095
management:
  endpoints:
    web:
      exposure:
        include: health,info
