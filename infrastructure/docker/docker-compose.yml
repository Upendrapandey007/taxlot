# =============================================================================
# Taxlot — Local Development Infrastructure
# =============================================================================
# Usage:
#   docker compose up -d        Start all infrastructure
#   docker compose down -v      Stop + delete volumes (full reset)
# Services are run separately via: ./gradlew :services:<name>:bootRun
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database (one instance, 15 logical databases)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: taxlot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       taxlot_auth
      POSTGRES_USER:     taxlot
      POSTGRES_PASSWORD: taxlot
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlot -d taxlot_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Redis — Cache, rate limiting, short-lived state
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taxlot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ — Message broker for domain events and async jobs
  # Management UI: http://localhost:15672  (guest/guest)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taxlot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mailhog — Local SMTP catcher
  # SMTP: localhost:1025  |  Web UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: taxlot-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: none

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for receipts, PDFs, documents
  # API: http://localhost:9000  |  Console: http://localhost:9001
  # Credentials: minioadmin / minioadmin
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: taxlot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: taxlot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/taxlot-receipts;
      mc mb --ignore-existing local/taxlot-documents;
      mc mb --ignore-existing local/taxlot-invoice-pdfs;
      mc anonymous set private local/taxlot-receipts;
      mc anonymous set private local/taxlot-documents;
      mc anonymous set private local/taxlot-invoice-pdfs;
      echo 'MinIO buckets ready';
      "
    restart: "no"

volumes:
  postgres_data:   { name: taxlot_postgres_data }
  redis_data:      { name: taxlot_redis_data }
  rabbitmq_data:   { name: taxlot_rabbitmq_data }
  minio_data:      { name: taxlot_minio_data }
