# =============================================================================
# Taxlot — Local Development Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and delete volumes (reset data)
#   docker compose logs -f        # Follow logs
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: taxlot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxlot
      POSTGRES_USER: taxlot
      POSTGRES_PASSWORD: taxlot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlot -d taxlot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — Cache, Rate Limiting, Short-lived State
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taxlot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mailhog — Local SMTP / Email Catcher
  # UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: taxlot-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    logging:
      driver: none    # Suppress verbose logs

  # ---------------------------------------------------------------------------
  # MinIO — Local S3-Compatible Object Storage (for receipts, files)
  # API: http://localhost:9000
  # Console: http://localhost:9001  (minioadmin / minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: taxlot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # MinIO Init — Creates default bucket on first run
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: taxlot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/taxlot-receipts;
      mc mb --ignore-existing local/taxlot-documents;
      mc anonymous set private local/taxlot-receipts;
      mc anonymous set private local/taxlot-documents;
      echo 'MinIO buckets ready';
      "
    restart: "no"

volumes:
  postgres_data:
    name: taxlot_postgres_data
  redis_data:
    name: taxlot_redis_data
  minio_data:
    name: taxlot_minio_data
