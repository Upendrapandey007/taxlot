# =============================================================================
# Taxlot — CI/CD Pipeline (Microservices Matrix)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:

  # ===========================================================================
  # Shared Platform Library
  # ===========================================================================
  shared-platform:
    name: shared/platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }
      - run: chmod +x gradlew
      - name: Build shared platform
        run: |
          if ! ./gradlew :shared:platform:assemble --no-daemon --stacktrace 2>&1 | tee build.log; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-debug-log
            git add build.log
            git commit -m "ci debug log [skip ci]" || true
            git push -f origin ci-debug-log || true
            exit 1
          fi



  # ===========================================================================
  # Active Services — Full test suites
  # ===========================================================================
  active-services:
    name: ${{ matrix.service }}
    needs: [shared-platform]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, organization-service, accounting-service, customer-service, invoice-service, payment-service, expense-service, tax-service]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       taxlot_test
          POSTGRES_USER:     taxlot
          POSTGRES_PASSWORD: taxlot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }
      - run: chmod +x gradlew

      - name: Unit Tests
        run: |
          if ! ./gradlew :services:${{ matrix.service }}:test --no-daemon --stacktrace 2>&1 | tee unit_test.log; then
            if [ "${{ matrix.service }}" = "api-gateway" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-debug-unit
              git add unit_test.log
              git commit -m "unit test debug log [skip ci]" || true
              git push -f origin ci-debug-unit || true
            fi
            exit 1
          fi
        env:
          JWT_SECRET: ci-test-secret-at-least-256-bits-long-for-hmac

      - name: Integration Tests
        run: |
          if ! ./gradlew :services:${{ matrix.service }}:integrationTest --no-daemon --stacktrace 2>&1 | tee integration_test.log; then
            if [ "${{ matrix.service }}" = "api-gateway" ] || [ "${{ matrix.service }}" = "auth-service" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-debug-it
              git add integration_test.log
              git commit -m "it debug log [skip ci]" || true
              git push -f origin ci-debug-it || true
            fi
            exit 1
          fi
        env:
          DB_URL:              jdbc:postgresql://localhost:5432/taxlot_test
          DB_USERNAME:         taxlot
          DB_PASSWORD:         taxlot
          REDIS_HOST:          localhost
          RABBITMQ_HOST:       localhost
          JWT_SECRET:          ci-test-secret-at-least-256-bits-long-for-hmac


      - name: Build JAR
        run: ./gradlew :services:${{ matrix.service }}:bootJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          retention-days: 7

  # ===========================================================================
  # Stub Services — Compile-only check
  # ===========================================================================
  stub-services:
    name: Stubs compile
    needs: [shared-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }
      - run: chmod +x gradlew
      - name: Compile all stub services
        run: |
          compile_stubs() {
            for svc in reporting-service document-service notification-service ai-service search-service integration-service; do
              echo "Compiling $svc..."
              ./gradlew :services:${svc}:compileKotlin --no-daemon --stacktrace || return 1
            done
          }
          if ! compile_stubs 2>&1 | tee stub_build.log; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-debug-stub
            git add stub_build.log
            git commit -m "stub debug log [skip ci]" || true
            git push -f origin ci-debug-stub || true
            exit 1
          fi


  # ===========================================================================
  # Web Application
  # ===========================================================================
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8080" }

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    needs: [active-services]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ===========================================================================
  # Docker Build & Push (main branch only)
  # ===========================================================================
  docker:
    name: Docker - ${{ matrix.service }}
    needs: [active-services, stub-services]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [api-gateway, auth-service, user-service, organization-service, accounting-service, customer-service, invoice-service, payment-service, expense-service, tax-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }
      - run: chmod +x gradlew && ./gradlew :services:${{ matrix.service }}:bootJar --no-daemon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max














