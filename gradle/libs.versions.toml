[versions]
kotlin                   = "2.0.0"
spring-boot              = "3.3.3"
spring-dep-mgmt          = "1.1.6"
spring-cloud             = "2023.0.3"
coroutines               = "1.8.1"
kotest                   = "5.9.1"
testcontainers           = "1.20.1"
jjwt                     = "0.12.6"
springdoc                = "2.6.0"
sentry                   = "7.14.0"
bouncycastle             = "1.78.1"
jackson                  = "2.17.2"

[libraries]
# Kotlin
kotlin-reflect                  = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-core         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-reactor      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "coroutines" }

# Spring Boot Starters
spring-boot-web                 = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-security            = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-validation          = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-actuator            = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-data-jdbc           = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-data-redis          = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-amqp                = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-cloud-gateway            = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-circuitbreaker     = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# Jackson
jackson-kotlin                  = { module = "com.fasterxml.jackson.module:jackson-module-kotlin",        version.ref = "jackson" }
jackson-jsr310                  = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310",    version.ref = "jackson" }

# Database
postgresql                      = { module = "org.postgresql:postgresql" }
flyway-core                     = { module = "org.flywaydb:flyway-core" }
flyway-postgresql               = { module = "org.flywaydb:flyway-database-postgresql" }

# JWT
jjwt-api                        = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl                       = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson                    = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Security
bouncycastle                    = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# OpenAPI
springdoc                       = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Sentry
sentry                          = { module = "io.sentry:sentry-spring-boot-starter-jakarta", version.ref = "sentry" }

# Testing
spring-boot-test                = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test            = { module = "org.springframework.security:spring-security-test" }
kotest-runner                   = { module = "io.kotest:kotest-runner-junit5",  version.ref = "kotest" }
kotest-assertions               = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
testcontainers-postgresql        = { module = "org.testcontainers:postgresql",   version.ref = "testcontainers" }
testcontainers-rabbitmq          = { module = "org.testcontainers:rabbitmq",     version.ref = "testcontainers" }
testcontainers-junit             = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[bundles]
kotlin-runtime      = ["kotlin-reflect", "kotlinx-coroutines-core", "kotlinx-coroutines-reactor"]
jackson             = ["jackson-kotlin", "jackson-jsr310"]
flyway              = ["flyway-core", "flyway-postgresql"]
jjwt-runtime        = ["jjwt-impl", "jjwt-jackson"]
kotest              = ["kotest-runner", "kotest-assertions"]
testcontainers-base = ["testcontainers-postgresql", "testcontainers-junit"]

[plugins]
kotlin-jvm               = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-spring            = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot              = { id = "org.springframework.boot",            version.ref = "spring-boot" }
spring-dep-mgmt          = { id = "io.spring.dependency-management",    version.ref = "spring-dep-mgmt" }
